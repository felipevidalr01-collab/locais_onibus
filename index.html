<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expresso Viação — Escolha de Poltronas e Comprovante</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <script>
// ... existing code ... -->
        /**
         * Preenche os dados no cartão visual do comprovante e gera o QR Code nativo (100% offline/sem CDN)
         */
        function renderVoucher(data) {
            document.getElementById('voucher-code').textContent = data.code;
            document.getElementById('voucher-seat-number').textContent = data.seat;
            document.getElementById('voucher-seat-position').textContent = data.position;
            document.getElementById('voucher-name').textContent = data.name;
            document.getElementById('voucher-doc').textContent = data.doc;
            document.getElementById('voucher-phone').textContent = data.phone;
            document.getElementById('voucher-boarding').textContent = data.boarding;
            document.getElementById('voucher-datetime').textContent = data.datetime;

            // Gera QR Code real em Canvas puro (funciona sem depender de bibliotecas externas)
            const qrContainer = document.getElementById('qrcode-container');
            qrContainer.innerHTML = '';

            // Texto curto e direto para leitura instantânea por qualquer câmera
            const qrPayload = `${data.code} | Poltrona ${data.seat} (${data.position}) | ${data.name}`;
            const qrCanvas = createNativeQRCanvas(qrPayload, 116);
            qrContainer.appendChild(qrCanvas);
        }

        /**
         * Gerador QR Code ISO/IEC 18004 (Byte Mode, Versões 1-6, ECC Level L) 100% nativo em JS
         */
        function createNativeQRCanvas(text, pixelSize) {
            const bytes = new TextEncoder().encode(text);
            const len = bytes.length;

            // Capacidade em bytes (Level L) para versões 1 a 6
            const capacities = [17, 32, 53, 78, 106, 134];
            let version = capacities.findIndex(c => len <= c) + 1;
            if (version === 0) version = 6; // limita ao máximo suportado

            const totalCodewords = [26, 44, 70, 100, 134, 172][version - 1];
            const ecCodewords = [7, 10, 15, 20, 26, 36][version - 1];
            const dataCapacity = totalCodewords - ecCodewords;

            // Monta bitstream (Mode 0100 = Byte, Count 8 bits, Data, Terminator, Padding)
            const bits = [];
            const pushBits = (val, n) => {
                for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1);
            };
            pushBits(0b0100, 4);
            const safeLen = Math.min(len, dataCapacity - 2);
            pushBits(safeLen, 8);
            for (let i = 0; i < safeLen; i++) pushBits(bytes[i], 8);
            pushBits(0, Math.min(4, dataCapacity * 8 - bits.length));
            while (bits.length % 8 !== 0) bits.push(0);

            const dataBytes = [];
            for (let i = 0; i < bits.length; i += 8) {
                let b = 0;
                for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
                dataBytes.push(b);
            }
            const padBytes = [0xec, 0x11];
            let padIdx = 0;
            while (dataBytes.length < dataCapacity) {
                dataBytes.push(padBytes[padIdx % 2]);
                padIdx++;
            }

            // Aritmética GF(256) para Reed-Solomon
            const exp = new Uint8Array(512);
            const log = new Uint8Array(256);
            let x = 1;
            for (let i = 0; i < 255; i++) {
                exp[i] = x;
                log[x] = i;
                x <<= 1;
                if (x & 0x100) x ^= 0x11d;
            }
            for (let i = 255; i < 512; i++) exp[i] = exp[i - 255];
            const gfMul = (a, b) => (a === 0 || b === 0) ? 0 : exp[log[a] + log[b]];

            // Polinômio gerador Reed-Solomon
            let gen = [1];
            for (let i = 0; i < ecCodewords; i++) {
                const next = new Array(gen.length + 1).fill(0);
                for (let j = 0; j < gen.length; j++) {
                    next[j] ^= gen[j];
                    next[j + 1] ^= gfMul(gen[j], exp[i]);
                }
                gen = next;
            }

            const rem = new Array(ecCodewords).fill(0);
            for (const b of dataBytes) {
                const factor = b ^ rem.shift();
                rem.push(0);
                for (let j = 0; j < ecCodewords; j++) {
                    rem[j] ^= gfMul(gen[j + 1], factor);
                }
            }

            const allCodewords = dataBytes.concat(rem);
            const size = version * 4 + 17;
            const modules = Array.from({ length: size }, () => new Array(size).fill(null));
            const isFunction = Array.from({ length: size }, () => new Array(size).fill(false));

            const setFunc = (r, c, dark) => {
                if (r >= 0 && r < size && c >= 0 && c < size) {
                    modules[r][c] = dark;
                    isFunction[r][c] = true;
                }
            };

            // Finder patterns + separadores
            const drawFinder = (r, c) => {
                for (let dr = -1; dr <= 7; dr++) {
                    for (let dc = -1; dc <= 7; dc++) {
                        const inOuter = dr >= 0 && dr <= 6 && dc >= 0 && dc <= 6;
                        const inInner = dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4;
                        const onBorder = dr === 0 || dr === 6 || dc === 0 || dc === 6;
                        setFunc(r + dr, c + dc, inOuter && (onBorder || inInner));
                    }
                }
            };
            drawFinder(0, 0);
            drawFinder(0, size - 7);
            drawFinder(size - 7, 0);

            // Alignment pattern (versões >= 2)
            if (version >= 2) {
                const pos = size - 7;
                for (let dr = -2; dr <= 2; dr++) {
                    for (let dc = -2; dc <= 2; dc++) {
                        const dark = Math.max(Math.abs(dr), Math.abs(dc)) !== 1;
                        setFunc(pos + dr, pos + dc, dark);
                    }
                }
            }

            // Timing patterns
            for (let i = 8; i < size - 8; i++) {
                setFunc(6, i, i % 2 === 0);
                setFunc(i, 6, i % 2 === 0);
            }

            // Dark module + reserva de format info
            setFunc(size - 8, 8, true);
            for (let i = 0; i < 9; i++) {
                if (!isFunction[8][i]) setFunc(8, i, false);
                if (!isFunction[i][8]) setFunc(i, 8, false);
            }
            for (let i = 0; i < 8; i++) {
                setFunc(8, size - 1 - i, false);
                setFunc(size - 1 - i, 8, false);
            }

            // Preenche dados em zigue-zague
            let bitIdx = 0;
            const totalBits = allCodewords.length * 8;
            let upward = true;
            for (let right = size - 1; right >= 1; right -= 2) {
                if (right === 6) right = 5;
                for (let vert = 0; vert < size; vert++) {
                    const r = upward ? size - 1 - vert : vert;
                    for (let j = 0; j < 2; j++) {
                        const c = right - j;
                        if (!isFunction[r][c]) {
                            let dark = false;
                            if (bitIdx < totalBits) {
                                dark = ((allCodewords[bitIdx >>> 3] >>> (7 - (bitIdx & 7))) & 1) === 1;
                                bitIdx++;
                            }
                            // Máscara 0: (r + c) % 2 === 0
                            if ((r + c) % 2 === 0) dark = !dark;
                            modules[r][c] = dark;
                        }
                    }
                }
                upward = !upward;
            }

            // Format info para ECC Level L (01) + Mask 0 (000) -> 0x77c4
            const fmtBits = 0x77c4;
            for (let i = 0; i < 15; i++) {
                const bit = ((fmtBits >>> i) & 1) === 1;
                if (i < 6) setFunc(i, 8, bit);
                else if (i < 8) setFunc(i + 1, 8, bit);
                else setFunc(size - 15 + i, 8, bit);

                if (i < 8) setFunc(8, size - 1 - i, bit);
                else if (i < 9) setFunc(8, 15 - i, bit);
                else setFunc(8, 14 - i, bit);
            }

            // Renderiza no Canvas com Quiet Zone de 2 módulos
            const quiet = 2;
            const fullModules = size + quiet * 2;
            const scale = Math.max(3, Math.floor(pixelSize / fullModules));
            const finalDim = fullModules * scale;

            const canvas = document.createElement('canvas');
            canvas.width = finalDim;
            canvas.height = finalDim;
            canvas.style.width = `${pixelSize}px`;
            canvas.style.height = `${pixelSize}px`;

            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, finalDim, finalDim);

            ctx.fillStyle = '#000000';
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (modules[r][c]) {
                        ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
                    }
                }
            }
            return canvas;
        }

        /**
         * Gera e baixa uma imagem PNG de alta resolução do comprovante via Canvas
         */
        function downloadVoucherPNG() {
            if (!currentTicketData) {
                showToast('Nenhum comprovante disponível para download.', 'error');
                return;
            }

            const canvas = document.getElementById('export-canvas');
            const ctx = canvas.getContext('2d');

            // Resolução 2x (Retina) para nitidez impecável no celular
            const width = 760;
            const height = 1040;
            canvas.width = width;
            canvas.height = height;

            // Fundo geral
            ctx.fillStyle = '#f1f5f9';
            ctx.fillRect(0, 0, width, height);

            // Cartão principal branco com borda arredondada
            const cardX = 40;
            const cardY = 40;
            const cardW = width - 80;
            const cardH = height - 80;

            drawRoundedRect(ctx, cardX, cardY, cardW, cardH, 28, '#ffffff');
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Cabeçalho Escuro
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(cardX + 28, cardY);
            ctx.lineTo(cardX + cardW - 28, cardY);
            ctx.quadraticCurveTo(cardX + cardW, cardY, cardX + cardW, cardY + 28);
            ctx.lineTo(cardX + cardW, cardY + 150);
            ctx.lineTo(cardX, cardY + 150);
            ctx.lineTo(cardX, cardY + 28);
            ctx.quadraticCurveTo(cardX, cardY, cardX + 28, cardY);
            ctx.closePath();
            ctx.fillStyle = '#0f172a';
            ctx.fill();
            ctx.restore();

            // Textos do Cabeçalho
            ctx.fillStyle = '#34d399';
            ctx.font = 'bold 18px Inter, sans-serif';
            ctx.fillText('COMPROVANTE DE ASSENTO', cardX + 40, cardY + 55);

            ctx.fillStyle = '#ffffff';
            ctx.font = '800 34px Inter, sans-serif';
            ctx.fillText('Bilhete de Embarque', cardX + 40, cardY + 102);

            // Badge Código no topo direito
            ctx.fillStyle = '#94a3b8';
            ctx.font = 'bold 15px Inter, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText('CÓDIGO', cardX + cardW - 40, cardY + 55);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px monospace';
            ctx.fillText(currentTicketData.code, cardX + cardW - 40, cardY + 95);
            ctx.textAlign = 'left';

            // Faixa de Destaque da Poltrona
            const seatBoxY = cardY + 150;
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(cardX + 2, seatBoxY, cardW - 4, 175);

            ctx.beginPath();
            ctx.moveTo(cardX, seatBoxY + 175);
            ctx.lineTo(cardX + cardW, seatBoxY + 175);
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#64748b';
            ctx.font = 'bold 18px Inter, sans-serif';
            ctx.fillText('POLTRONA RESERVADA', cardX + 40, seatBoxY + 48);

            ctx.fillStyle = '#0f172a';
            ctx.font = '900 76px monospace';
            ctx.fillText(currentTicketData.seat, cardX + 40, seatBoxY + 132);

            // Pill Janela / Corredor
            drawRoundedRect(ctx, cardX + 165, seatBoxY + 86, 145, 42, 21, '#d1fae5');
            ctx.fillStyle = '#065f46';
            ctx.font = 'bold 20px Inter, sans-serif';
            ctx.fillText(currentTicketData.position.toUpperCase(), cardX + 188, seatBoxY + 114);

            // Categoria à direita
            ctx.textAlign = 'right';
            ctx.fillStyle = '#64748b';
            ctx.font = 'bold 18px Inter, sans-serif';
            ctx.fillText('CATEGORIA', cardX + cardW - 40, seatBoxY + 48);

            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 24px Inter, sans-serif';
            ctx.fillText('Executivo Semileito', cardX + cardW - 40, seatBoxY + 88);

            ctx.fillStyle = '#64748b';
            ctx.font = '500 20px Inter, sans-serif';
            ctx.fillText('46 Lugares', cardX + cardW - 40, seatBoxY + 120);
            ctx.textAlign = 'left';

            // Corpo de Informações do Passageiro
            let cursorY = seatBoxY + 235;

            // Nome
            ctx.fillStyle = '#94a3b8';
            ctx.font = 'bold 17px Inter, sans-serif';
            ctx.fillText('PASSAGEIRO(A)', cardX + 40, cursorY);

            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 28px Inter, sans-serif';
            const displayName = currentTicketData.name.length > 34
                ? currentTicketData.name.substring(0, 34) + '...'
                : currentTicketData.name;
            ctx.fillText(displayName, cardX + 40, cursorY + 38);

            // Documento e Telefone
            cursorY += 105;
            ctx.fillStyle = '#94a3b8';
            ctx.font = 'bold 17px Inter, sans-serif';
            ctx.fillText('DOCUMENTO', cardX + 40, cursorY);
            ctx.fillText('TELEFONE', cardX + 360, cursorY);

            ctx.fillStyle = '#1e293b';
            ctx.font = '600 23px monospace';
            ctx.fillText(currentTicketData.doc, cardX + 40, cursorY + 35);
            ctx.font = '600 23px Inter, sans-serif';
            ctx.fillText(currentTicketData.phone, cardX + 360, cursorY + 35);

            // Local de Embarque
            cursorY += 100;
            ctx.fillStyle = '#94a3b8';
            ctx.font = 'bold 17px Inter, sans-serif';
            ctx.fillText('LOCAL DE EMBARQUE', cardX + 40, cursorY);

            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 23px Inter, sans-serif';
            ctx.fillText(currentTicketData.boarding, cardX + 40, cursorY + 35);

            // Data e Hora
            cursorY += 95;
            ctx.fillStyle = '#94a3b8';
            ctx.font = 'bold 17px Inter, sans-serif';
            ctx.fillText('DATA E HORA DA EMISSÃO', cardX + 40, cursorY);

            ctx.fillStyle = '#475569';
            ctx.font = '600 21px monospace';
            ctx.fillText(currentTicketData.datetime, cardX + 40, cursorY + 34);

            // Linha Picotada e Recortes Laterais
            const tearY = cardY + cardH - 195;
            ctx.save();
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(cardX + 30, tearY);
            ctx.lineTo(cardX + cardW - 30, tearY);
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();

            // Círculos laterais simulando picote
            ctx.fillStyle = '#f1f5f9';
            ctx.beginPath();
            ctx.arc(cardX, tearY, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cardX + cardW, tearY, 22, 0, Math.PI * 2);
            ctx.fill();

            // Rodapé com instruções e QR Code copiado do DOM
            const footerY = tearY + 42;
            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 21px Inter, sans-serif';
            ctx.fillText('Validação de Embarque', cardX + 40, footerY + 18);

            ctx.fillStyle = '#64748b';
            ctx.font = '400 18px Inter, sans-serif';
            ctx.fillText('Apresente este comprovante digital ou impresso', cardX + 40, footerY + 52);
            ctx.fillText('ao motorista ou coordenador antes de embarcar.', cardX + 40, footerY + 78);

            // Desenha o QR Code gerado na tela dentro do Canvas sem suavização (nitidez máxima)
            const qrCanvas = document.querySelector('#qrcode-container canvas');
            const qrImg = document.querySelector('#qrcode-container img');
            const qrSize = 132;
            const qrX = cardX + cardW - 40 - qrSize;
            const qrY = tearY + 20;

            drawRoundedRect(ctx, qrX - 10, qrY - 10, qrSize + 20, qrSize + 20, 14, '#ffffff');
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.save();
            ctx.imageSmoothingEnabled = false;
            if (qrCanvas) {
                ctx.drawImage(qrCanvas, qrX, qrY, qrSize, qrSize);
            } else if (qrImg && qrImg.complete) {
                ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);
            }
            ctx.restore();

            // Dispara o download do arquivo PNG
            try {
                const dataUrl = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                const safeName = currentTicketData.name
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .replace(/[^a-zA-Z0-9]/g, '_')
                    .toLowerCase();

                link.download = `comprovante_poltrona_${currentTicketData.seat}_${safeName}.png`;
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                showToast('Download da imagem PNG iniciado!', 'success');
            } catch (err) {
                console.error('Erro ao exportar PNG:', err);
                showToast('Não foi possível baixar a imagem. Tente usar "Imprimir / Salvar PDF".', 'error');
            }
        }

        /**
         * Auxiliar para desenhar retângulos com cantos arredondados no Canvas
         */
        function drawRoundedRect(ctx, x, y, width, height, radius, fillColor) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            if (fillColor) {
                ctx.fillStyle = fillColor;
                ctx.fill();
            }
        }

        /**
         * Volta para o formulário para realizar outra reserva
         */
        function startNewReservation() {
            document.getElementById('reservation-form').reset();
            document.getElementById('voucher-section').classList.add('hidden');
            document.getElementById('booking-form-card').classList.remove('hidden');
            selectedSeat = null;
            updateSelectedBadge();
            renderBusMap();
        }

        /**
         * Restaura o mapa para o estado inicial de demonstração
         */
        function resetDemoData() {
            occupiedSeats = [...DEFAULT_OCCUPIED];
            selectedSeat = null;
            saveOccupiedSeats();
            updateSelectedBadge();
            renderBusMap();
            startNewReservation();
            showToast('Mapa de assentos restaurado com sucesso.', 'info');
        }

        /**
         * Máscaras leves para telefone e documento
         */
        function setupInputMasks() {
            const phoneInput = document.getElementById('passenger-phone');
            phoneInput.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, '');
                if (v.length > 11) v = v.slice(0, 11);
                if (v.length > 6) {
                    e.target.value = `(${v.slice(0, 2)}) ${v.slice(2, 7)}-${v.slice(7)}`;
                } else if (v.length > 2) {
                    e.target.value = `(${v.slice(0, 2)}) ${v.slice(2)}`;
                } else if (v.length > 0) {
                    e.target.value = `(${v}`;
                }
            });
        }

        /**
         * Exibe notificação visual amigável (Toast)
         */
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            const colors = {
                success: 'bg-slate-900 text-white border-emerald-500',
                error: 'bg-red-600 text-white border-red-800',
                info: 'bg-slate-800 text-white border-slate-600'
            };

            toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg border-l-4 text-xs sm:text-sm font-medium flex items-center justify-between gap-3 transition-all duration-300 ${colors[type] || colors.info}`;
            toast.innerHTML = `<span>${message}</span>`;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(8px)';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }
    </script>
</body>
</html>
